name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código do Repositório
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Instala as dependências listadas
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Verificação de Sintaxe (Syntax Check)
      run: |
        # Verifica se há falhas de sintaxe nos scripts python principais
        python -m py_compile admin.py
        python -m py_compile public.py
